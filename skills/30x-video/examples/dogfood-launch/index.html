<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>30x-video Dogfood Launch</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #131413;
        font-family: 'Inter', sans-serif;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      /* Hide HyperFrames watermarks embedded in catalog blocks */
      [data-composition-id="vfx-text-cursor"] .stage-logo-wrap,
      [data-composition-id="vfx-text-cursor"] .stage-logo,
      [data-composition-id="vfx-text-cursor"] .vfx-stage-logo {
        display: none !important;
      }
      /* Force dark theme bgs across all blocks (defensive override) */
      [data-composition-id="data-chart"],
      [data-composition-id="flowchart"],
      [data-composition-id="logo-outro"],
      [data-composition-id="vfx-text-cursor"] {
        background: #131413 !important;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="24"
      data-width="1920"
      data-height="1080"
    >
      <!--
        4 catalog blocks composed via data-composition-src:
          0-8s   vfx-text-cursor   "a video" shader-rendered text reveal
          8-15s  data-chart        Refero design metadata as chart
          15-19s flowchart         pipeline diagram with SVG + typing
          19-24s logo-outro        cinematic 30x-video brand reveal
      -->

      <div class="layer clip"
        data-composition-id="hook"
        data-composition-src="compositions/vfx-text-cursor.html"
        data-start="0" data-duration="8"
        data-width="1920" data-height="1080" data-track-index="10"></div>

      <div class="layer clip"
        data-composition-id="metadata"
        data-composition-src="compositions/data-chart.html"
        data-start="8" data-duration="7"
        data-width="1920" data-height="1080" data-track-index="20"></div>

      <div class="layer clip"
        data-composition-id="pipeline"
        data-composition-src="compositions/flowchart.html"
        data-start="15" data-duration="4"
        data-width="1920" data-height="1080" data-track-index="30"></div>

      <div class="layer clip"
        data-composition-id="outro"
        data-composition-src="compositions/logo-outro.html"
        data-start="19" data-duration="5"
        data-width="1920" data-height="1080" data-track-index="40"></div>

      <audio class="clip" id="vo-track" src="assets/vo.wav"
        data-start="0" data-duration="24" data-track-index="80" preload="auto"></audio>
      <audio class="clip" id="bgm-track" src="assets/bgm.mp3"
        data-start="0" data-duration="24" data-track-index="70" preload="auto"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
