<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>30x-video Dogfood Launch</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=block"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #000000;
        --text: #ffffff;
        --text-dim: #909398;
        --accent: #5e6cd0;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: var(--bg); color: var(--text);
        font-family: 'Inter', sans-serif;
        font-feature-settings: 'cv11', 'ss01', 'tnum';
      }
      .scene { position: absolute; inset: 0; opacity: 0; z-index: 5; }

      /* Shimmer plumbing */
      .shimmer-sweep-target { position: relative; display: inline-block; }
      .shimmer-sweep-target .shimmer-mask {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        background: linear-gradient(
          110deg,
          transparent 0%,
          transparent calc(var(--shimmer-pos, -20%) - 10%),
          rgba(255,255,255,0.55) var(--shimmer-pos, -20%),
          transparent calc(var(--shimmer-pos, -20%) + 10%),
          transparent 100%
        );
        mix-blend-mode: overlay;
      }

      /* ──────── Frame 1: Hero ──────── */
      #f1 {
        display: flex; align-items: center;
        padding-left: 230px;  /* 12% of 1920 */
      }
      #f1 .hero {
        font-size: 240px; font-weight: 500; letter-spacing: -0.04em;
        line-height: 1.0; max-width: 1500px;
      }
      #f1 .l1, #f1 .l2 {
        display: block; opacity: 0; transform: translateY(60px);
      }
      #f1 .accent { color: var(--accent); }

      /* ──────── Frame 2: Number ──────── */
      #f2 {
        display: flex; align-items: center; justify-content: center;
        position: relative;
      }
      #f2 .num {
        font-size: 360px; font-weight: 500; letter-spacing: -0.025em;
        line-height: 1; opacity: 0;
        font-variant-numeric: tabular-nums;
      }
      #f2 .num .plus { color: var(--accent); }
      #f2 .glow-ring {
        position: absolute; left: 50%; top: 50%;
        width: 100px; height: 100px;
        transform: translate(-50%, -50%) scale(0);
        background: radial-gradient(circle, rgba(94,108,208,0.40) 0%, transparent 60%);
        pointer-events: none; opacity: 0;
      }
      #f2 .caption {
        position: absolute; left: 230px; bottom: 230px;
        font-size: 28px; font-weight: 400; color: var(--text-dim);
        letter-spacing: 0.02em; opacity: 0;
      }
      #f2 .caption .em { color: var(--text); }

      /* ──────── Frame 3: Brand ──────── */
      #f3 {
        display: flex; align-items: center; justify-content: center;
      }
      #f3 .brand-stack {
        display: flex; flex-direction: column; align-items: center;
        text-align: center; gap: 56px;
      }
      #f3 .wordmark {
        font-size: 280px; font-weight: 600; letter-spacing: -0.045em;
        line-height: 1; opacity: 0; transform: scale(1.5);
        transform-origin: center center;
      }
      #f3 .tagline-stack {
        display: flex; flex-direction: column; gap: 8px;
        align-items: center;
      }
      #f3 .tag {
        font-size: 64px; font-weight: 400; letter-spacing: -0.02em;
        line-height: 1.1; opacity: 0; transform: translateY(20px);
        color: var(--text-dim);
      }
      #f3 .tag.accent { color: var(--accent); font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22"
         data-width="1920" data-height="1080">

      <!-- ───── Frame 1 (0-7s): Hero ───── -->
      <div class="clip scene" id="f1" data-start="0" data-duration="7"
           data-width="1920" data-height="1080" data-track-index="10">
        <div class="hero">
          <span class="l1">Make a 15s social</span>
          <span class="l2 shimmer-sweep-target">about <span class="accent">morning routines.</span></span>
        </div>
      </div>

      <!-- ───── Frame 2 (7-13s): Number ───── -->
      <div class="clip scene" id="f2" data-start="7" data-duration="6"
           data-width="1920" data-height="1080" data-track-index="11">
        <div class="glow-ring"></div>
        <div class="num"><span class="count" data-target="125000">0</span><span class="plus">+</span></div>
        <div class="caption"><span class="em">Real design references.</span> Via Refero.</div>
      </div>

      <!-- ───── Frame 3 (13-22s): Brand ───── -->
      <div class="clip scene" id="f3" data-start="13" data-duration="9"
           data-width="1920" data-height="1080" data-track-index="12">
        <div class="brand-stack">
          <div class="wordmark shimmer-sweep-target">30x-video</div>
          <div class="tagline-stack">
            <div class="tag t1">Tell it what you want.</div>
            <div class="tag t2 accent">Get a video.</div>
          </div>
        </div>
      </div>

      <!-- Continuous grain overlay (only catalog component) -->
      <div class="layer clip" data-composition-id="grain"
           data-composition-src="compositions/components/grain-overlay.html"
           data-start="0" data-duration="22"
           data-width="1920" data-height="1080" data-track-index="99"></div>

      <audio class="clip" id="vo-track" src="assets/vo.wav"
             data-start="0" data-duration="22" data-track-index="80" preload="auto"></audio>
      <audio class="clip" id="bgm-track" src="assets/bgm.mp3"
             data-start="0" data-duration="22" data-track-index="70" preload="auto"></audio>
    </div>

    <script>
      // Auto-inject .shimmer-mask
      document.querySelectorAll(".shimmer-sweep-target").forEach((el) => {
        if (!el.querySelector(".shimmer-mask")) {
          const m = document.createElement("div");
          m.className = "shimmer-mask";
          el.appendChild(m);
        }
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ════════ FRAME 1: Hero (0-7s) ════════
         hold-then-snap: enter 0-1.2s, hold 1.2-2s,
         shimmer 2-3.5s, hold STILL 3.5-6s (2.5s),
         exit 6-6.7s
      */
      tl.to("#f1", { opacity: 1, duration: 0.4, ease: "none" }, 0);
      tl.to("#f1 .l1", { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      tl.to("#f1 .l2", { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.7);
      // shimmer sweep across "about morning routines."
      tl.fromTo("#f1 .shimmer-sweep-target",
        { "--shimmer-pos": "-20%" },
        { "--shimmer-pos": "120%", duration: 1.5, ease: "power2.inOut" },
        2.0
      );
      // HOLD STILL 3.5-6.0s (no animation = the whole point)
      tl.to("#f1", { opacity: 0, duration: 0.5, ease: "none" }, 6.3);

      /* ════════ FRAME 2: 125,000+ (7-13s) ════════
         enter 7-7.4s, count-up 7.4-9.4s, pop+ring 9.4-10s,
         caption fade-in 9.6-10s, hold STILL 10-12.5s, exit 12.5-13s
      */
      tl.to("#f2", { opacity: 1, duration: 0.4, ease: "none" }, 7.0);
      tl.to("#f2 .num", { opacity: 1, duration: 0.5, ease: "power3.out" }, 7.0);
      // count up
      tl.to({ val: 0 }, {
        val: 125000, duration: 2.0, ease: "power3.out",
        onUpdate: function() {
          const n = Math.round(this.targets()[0].val);
          const el = document.querySelector("#f2 .count");
          if (el) el.textContent = n.toLocaleString();
        },
      }, 7.4);
      // scale pop on number landing
      tl.to("#f2 .num", { scale: 1.06, duration: 0.25, ease: "power2.out" }, 9.4);
      tl.to("#f2 .num", { scale: 1.0, duration: 0.5, ease: "power2.inOut" }, 9.65);
      // glow ring expanding outward
      tl.to("#f2 .glow-ring", {
        opacity: 1, scale: 16, duration: 1.2, ease: "power2.out"
      }, 9.4);
      tl.to("#f2 .glow-ring", { opacity: 0, duration: 0.6 }, 10.4);
      // caption appears below
      tl.to("#f2 .caption", { opacity: 1, duration: 0.6 }, 9.8);
      // HOLD STILL 10.4-12.5s (no animations)
      tl.to("#f2", { opacity: 0, duration: 0.5, ease: "none" }, 12.5);

      /* ════════ FRAME 3: Brand (13-22s) ════════
         enter 13-14s (camera pull-back), hold 14-15s, shimmer 15-16.5s,
         tagline fade 16.5-17.5s, hold STILL 17.5-21s (3.5s), exit 21-22s
      */
      tl.to("#f3", { opacity: 1, duration: 0.4, ease: "none" }, 13.0);
      // wordmark scale 1.5 → 1.0 (camera pull back)
      tl.to("#f3 .wordmark", {
        opacity: 1, scale: 1, duration: 1.0, ease: "power3.out"
      }, 13.2);
      // shimmer across wordmark
      tl.fromTo("#f3 .shimmer-sweep-target",
        { "--shimmer-pos": "-20%" },
        { "--shimmer-pos": "120%", duration: 1.5, ease: "power2.inOut" },
        15.0
      );
      // tagline cascade
      tl.to("#f3 .t1", { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 16.5);
      tl.to("#f3 .t2", { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 17.0);
      // HOLD STILL 17.7-21s (3.3s)
      tl.to("#f3", { opacity: 0, duration: 1.0, ease: "none" }, 21.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
