<!-- hyperframes-registry-item: logo-outro -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Logo Outro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0f;
      }
    </style>
  </head>
  <body>
    <div
      id="logo-outro"
      data-composition-id="logo-outro"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="6"
    >
      <div class="canvas">
        <!-- Glow effect behind the logo -->
        <div class="logo-glow"></div>

        <!-- Logo Container -->
        <div class="logo-container">
          <!-- 30x-video wordmark — 5 char-pieces using existing 5-piece animation classes -->
          <div class="wordmark">
            <span class="logo-piece logo-tl">3</span><span class="logo-piece logo-tr">0</span><span class="logo-piece logo-ml">x</span><span class="logo-piece logo-mr">/</span><span class="logo-piece logo-bl">v</span>
          </div>
        </div>

        <div class="text-container">
          <div class="tagline">Tell it what you want.</div>
          <div class="url-pill">
            <span class="url-text">30x-video</span>
          </div>
        </div>
      </div>

      <style>
        [data-composition-id="logo-outro"] .canvas {
          width: 1920px;
          height: 1080px;
          background: #131413;
          position: relative;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }

        [data-composition-id="logo-outro"] .logo-container {
          position: absolute;
          left: 50%;
          top: 380px;
          transform: translateX(-50%);
          width: auto;
          height: 200px;
          z-index: 2;
          display: flex;
          align-items: center;
        }
        [data-composition-id="logo-outro"] .wordmark {
          display: flex;
          gap: 0;
          font-family: "Inter", sans-serif;
          font-weight: 600;
          font-size: 180px;
          letter-spacing: -0.04em;
          line-height: 1;
          color: #F3F8F8;
        }
        [data-composition-id="logo-outro"] .wordmark .logo-piece {
          display: inline-block;
        }
        [data-composition-id="logo-outro"] .wordmark .logo-mr {
          color: #5E6CD0;
          font-weight: 400;
          padding: 0 8px;
        }

        [data-composition-id="logo-outro"] .logo-piece {
          transform-origin: center center;
          opacity: 0;
        }

        [data-composition-id="logo-outro"] .logo-glow {
          position: absolute;
          left: 760px;
          top: 300px;
          width: 400px;
          height: 400px;
          background: radial-gradient(circle, rgba(94, 108, 208, 0.28) 0%, rgba(19, 20, 19, 0) 70%);
          border-radius: 50%;
          opacity: 0;
          pointer-events: none;
          z-index: 1;
        }

        [data-composition-id="logo-outro"] .text-container {
          position: absolute;
          top: 720px;
          width: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          z-index: 3;
        }

        [data-composition-id="logo-outro"] .tagline {
          font-size: 56px;
          font-weight: 500;
          color: #F3F8F8;
          opacity: 0;
          margin-bottom: 28px;
          text-align: center;
          letter-spacing: -0.02em;
          font-family: "Inter", sans-serif;
        }

        [data-composition-id="logo-outro"] .url-pill {
          background: rgba(94, 108, 208, 0.12);
          border: 1px solid rgba(94, 108, 208, 0.4);
          border-radius: 100px;
          padding: 10px 28px;
          opacity: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        [data-composition-id="logo-outro"] .url-text {
          font-size: 22px;
          color: #5E6CD0;
          letter-spacing: 0.04em;
          font-weight: 500;
          font-family: "Inter", sans-serif;
        }
      </style>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          const pieces = {
            tl: '[data-composition-id="logo-outro"] .logo-tl',
            tr: '[data-composition-id="logo-outro"] .logo-tr',
            ml: '[data-composition-id="logo-outro"] .logo-ml',
            mr: '[data-composition-id="logo-outro"] .logo-mr',
            bl: '[data-composition-id="logo-outro"] .logo-bl',
          };

          const pieceArray = [pieces.tl, pieces.tr, pieces.ml, pieces.mr, pieces.bl];
          const logoGlow = '[data-composition-id="logo-outro"] .logo-glow';
          const tagline = '[data-composition-id="logo-outro"] .tagline';
          const urlPill = '[data-composition-id="logo-outro"] .url-pill';

          // 1. Pieces slide in from the right with ripple stagger
          pieceArray.forEach((piece, i) => {
            tl.fromTo(
              piece,
              { x: 1920, opacity: 0 },
              { x: 0, opacity: 1, duration: 1.2, ease: "power4.out" },
              i * 0.08,
            );
          });

          // 2. Expand and close
          const expandTime = 1.2;

          tl.to(
            pieceArray,
            { scale: 1.15, duration: 0.5, ease: "back.out(1.7)", stagger: 0.02 },
            expandTime,
          );

          tl.to(pieceArray, { scale: 1, duration: 0.4, ease: "power2.inOut" }, expandTime + 0.3);

          // 3. Glow bloom
          tl.fromTo(
            logoGlow,
            { opacity: 0, scale: 0.5 },
            { opacity: 1, scale: 1.2, duration: 0.4, ease: "power2.out" },
            expandTime,
          );
          tl.to(
            logoGlow,
            { opacity: 0, scale: 1.8, duration: 1.2, ease: "power2.out" },
            expandTime + 0.4,
          );

          // 4. Tagline and URL pill fade in
          const textStartTime = expandTime + 0.8;
          tl.fromTo(
            tagline,
            { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: 1, ease: "power3.out" },
            textStartTime,
          );

          tl.fromTo(
            urlPill,
            { opacity: 0, y: 15 },
            { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
            textStartTime + 0.4,
          );

          window.__timelines = window.__timelines || {};
          window.__timelines["logo-outro"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
