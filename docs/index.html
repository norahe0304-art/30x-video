<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30X — Web-to-Video</title>
<meta name="description" content="One URL in. An agency-grade launch video out.">
<meta property="og:title" content="30X — Web-to-Video">
<meta property="og:description" content="One URL in. An agency-grade launch video out. Zero templates.">
<meta property="og:image" content="https://norahe0304-art.github.io/30x-video/posters/07-jetpartners.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --ivory: #F7F6F4; --ink: #1a1a1a; --mut: #6b6b68; }
  body { background: var(--ivory); color: var(--ink); font-family: "Inter", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .serif { font-family: "Cormorant Garamond", Georgia, serif; }
  a { color: inherit; }

  /* ── split hero (dior verbatim grammar) ── */
  .hero { position: relative; height: 100vh; background: var(--ivory); }
  .hero-half { position: absolute; left: 0; top: 0; width: 50%; height: 100%; overflow: hidden; background: #0c0c0c; }
  .hero-half video { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) brightness(0.62) contrast(1.06); }
  .wordmark {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 4;
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500;
    font-size: clamp(72px, 9.5vw, 150px); letter-spacing: 0.34em; text-indent: 0.34em;
    color: #fff; white-space: nowrap; opacity: 0; transition: opacity 2.2s ease .3s;
  }
  .wordmark.in { opacity: 1; }
  .hero-cap { position: absolute; left: 25%; bottom: 7.5vh; transform: translateX(-50%); z-index: 5; text-align: center; color: #EDEBE6;
    opacity: 0; transition: opacity 1.8s ease 1s; }
  .hero-cap.in { opacity: 1; }
  .hero-cap .t { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400; font-size: clamp(26px, 2.8vw, 40px); letter-spacing: 0.02em; }
  .hero-cap a { display: inline-block; margin-top: 13px; font-size: 12px; font-weight: 400; letter-spacing: 0.06em; color: #EDEBE6; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 0.5px; }
  .hero-cap2 { position: absolute; left: 75%; bottom: 7.5vh; transform: translateX(-50%); z-index: 5; text-align: center;
    opacity: 0; transition: opacity 1.8s ease 1.3s; }
  .hero-cap2.in { opacity: 1; }
  .hero-cap2 .t { font-family: "Cormorant Garamond", Georgia, serif; font-size: clamp(26px, 2.8vw, 40px); letter-spacing: 0.02em; }
  .hero-cap2 code { display: inline-block; margin-top: 13px; font-size: 12px; color: var(--mut); font-family: "Inter", sans-serif;
    text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 0.5px; cursor: pointer; }

  /* ── section label ── */
  .slabel { text-align: center; padding: clamp(80px, 12vh, 130px) 24px clamp(34px, 5vh, 54px);
    font-size: 11px; letter-spacing: 0.42em; text-transform: uppercase; color: var(--mut); }

  /* ── dior push rows: two half-width blocks, caption ON image bottom-center ── */
  .row { display: grid; grid-template-columns: 1fr 1fr; }
  @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
  .push { position: relative; overflow: hidden; background: #0c0c0c; cursor: pointer; }
  .push video { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block;
    filter: grayscale(1) brightness(0.68); transition: filter 1s ease; }
  .push:hover video, .push.playing video { filter: none; }
  .pcap { position: absolute; left: 50%; bottom: 6.5%; transform: translateX(-50%); text-align: center; color: #EFEDE8; z-index: 3; pointer-events: none; }
  .pcap .t { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400; font-size: clamp(24px, 2.4vw, 36px); letter-spacing: 0.02em; text-shadow: 0 2px 22px rgba(0,0,0,0.4); }
  .pcap .s { margin-top: 10px; font-size: 11.5px; letter-spacing: 0.08em; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 0.5px; }

  .reveal { opacity: 0; transform: translateY(18px); transition: opacity 1.3s ease, transform 1.4s ease; }
  .reveal.in { opacity: 1; transform: none; }

  /* ── atelier note ── */
  .note { text-align: center; max-width: 640px; margin: 0 auto; padding: 0 24px clamp(34px, 5vh, 54px);
    font-family: "Cormorant Garamond", Georgia, serif; font-size: clamp(19px, 2vw, 24px); line-height: 1.75; color: var(--ink); }

  footer { text-align: center; padding: clamp(110px, 16vh, 190px) 24px 100px; }
  .fmark { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: clamp(46px, 5.5vw, 84px); letter-spacing: 0.34em; text-indent: 0.34em; }
  .fcmd { margin-top: 30px; }
  .fcmd code { font-size: 12.5px; color: var(--ink); font-family: "Inter", sans-serif;
    text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 0.5px; cursor: pointer; }
  .flinks { margin-top: 40px; font-size: 11px; letter-spacing: 0.4em; color: var(--mut); text-transform: uppercase;
    display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
  .flinks a { text-decoration: none; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-half"><video autoplay muted loop playsinline src="films/07-jetpartners.mp4" poster="posters/07-jetpartners.jpg"></video></div>
  <div class="wordmark" id="wm">30X</div>
  <div class="hero-cap" id="c1">
    <div class="t serif">Web-to-Video Films</div>
    <a href="#films">Discover</a>
  </div>
  <div class="hero-cap2" id="c2">
    <div class="t serif">One URL in. A film out.</div>
    <code onclick="navigator.clipboard.writeText('npx 30x-web-to-video --global')">npx 30x-web-to-video --global</code>
  </div>
</div>

<main id="films"></main>

<footer>
  <div class="fmark">30X</div>
  <div class="fcmd"><code onclick="navigator.clipboard.writeText('npx 30x-web-to-video --global')">npx 30x-web-to-video --global</code></div>
  <div class="flinks">
    <a href="https://github.com/norahe0304-art/30x-video" target="_blank">GitHub</a>
    <a href="https://www.npmjs.com/package/30x-web-to-video" target="_blank">npm</a>
    <span>Built with Claude Code</span>
  </div>
</footer>

<script>
setTimeout(() => document.getElementById("wm").classList.add("in"), 150);
setTimeout(() => document.getElementById("c1").classList.add("in"), 500);
setTimeout(() => document.getElementById("c2").classList.add("in"), 700);

const GROUPS = [
  { label: "Colour & Craft", films: [
    ["05-mana","Maná"],["10-corgi","Corgi"],["06-cofounder","Cofounder"],["04-parker","Parker"]] },
  { label: "Paper & Ink", films: [
    ["14-laper","Laper"],["11-orchid","Orchid"]] },
  { label: "Night & Light", films: [
    ["12-therasun","TheraSun"],["18-solounicorn","Solo Unicorn Club"],["01-happy-model","Happy Model"],["13-idensia","Idensia"]] },
  { label: "Quiet Luxury", films: [
    ["07-jetpartners","JetPartners"],["02-caylent","Caylent"]] },
];

function push([f, b]) {
  return `
  <div class="push" data-f="${f}">
    <video preload="none" poster="posters/${f}.jpg" playsinline loop muted src="films/${f}.mp4"></video>
    <div class="pcap"><div class="t">${b}</div><div class="s">Watch the film</div></div>
  </div>`;
}

const main = document.getElementById("films");
GROUPS.forEach(g => {
  const rows = [];
  for (let i = 0; i < g.films.length; i += 2) rows.push(g.films.slice(i, i + 2));
  main.insertAdjacentHTML("beforeend", `
    <div class="slabel reveal">${g.label}</div>
    ${rows.map(r => `<div class="row reveal">${r.map(push).join("")}</div>`).join("")}`);
});

main.insertAdjacentHTML("beforeend", `
  <div class="slabel reveal">The Atelier</div>
  <div class="note reveal serif">The same brand, commissioned twice. Each run cuts its own cloth — never the same film twice.</div>
  <div class="row reveal">${push(["15-dusty","Dusty & Co — Take One"])}${push(["17-dusty-v2","Dusty & Co — Take Two"])}</div>`);

const ro = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add("in"); ro.unobserve(e.target); }
}), { rootMargin: "-40px" });
document.querySelectorAll(".reveal").forEach(el => ro.observe(el));

document.querySelectorAll(".push").forEach(card => {
  const v = card.querySelector("video");
  card.addEventListener("mouseenter", () => { v.muted = true; v.play().catch(()=>{}); });
  card.addEventListener("mouseleave", () => { if (v.muted) { v.pause(); v.currentTime = 0; card.classList.remove("playing"); } });
  card.addEventListener("click", () => {
    document.querySelectorAll(".push video").forEach(o => { if (o !== v) { o.pause(); o.muted = true; o.controls = false; o.closest(".push").classList.remove("playing"); } });
    v.muted = false; v.controls = true; card.classList.add("playing"); v.play().catch(()=>{});
  });
});

const vio = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.preload = "metadata"; vio.unobserve(e.target); }
}), { rootMargin: "500px" });
document.querySelectorAll(".push video").forEach(v => vio.observe(v));
</script>

</body>
</html>
