<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30x web-to-video</title>
<meta name="description" content="One URL in. An agency-grade launch video out. A Claude Code skill.">
<meta property="og:title" content="30x web-to-video">
<meta property="og:description" content="One URL in. An agency-grade launch video out.">
<meta property="og:image" content="https://norahe0304-art.github.io/30x-video/posters/05-mana.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg: #0A0A0C; --ink: #F4F2ED; --muted: rgba(244,242,237,0.5); --dim: rgba(244,242,237,0.28); --green: #9BE8C8; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: clamp(44px, 8vh, 96px) clamp(18px, 4.5vw, 96px) 110px;
  }
  header { max-width: 1520px; margin: 0 auto clamp(48px, 7vh, 84px); display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 18px; }
  h1 { font-weight: 650; font-size: clamp(26px, 3.2vw, 44px); letter-spacing: -0.03em; }
  h1 .soft { color: var(--muted); font-weight: 300; }
  .side { display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap; }
  .cmd {
    font-family: "SF Mono", Menlo, monospace; font-size: 13px; color: var(--green);
    background: rgba(155,232,200,0.06); border: 1px solid rgba(155,232,200,0.13);
    padding: 9px 16px; border-radius: 10px; cursor: pointer; user-select: all;
  }
  .cmd:hover { background: rgba(155,232,200,0.12); }
  .gh { font-size: 13px; color: var(--dim); text-decoration: none; }
  .gh:hover { color: var(--ink); }
  .grid { max-width: 1520px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(400px, 100%), 1fr)); gap: clamp(30px, 3.6vw, 52px) 36px; }
  .card video { width: 100%; aspect-ratio: 16/9; border-radius: 14px; display: block; background: #000; box-shadow: 0 24px 60px rgba(0,0,0,0.45); }
  .meta { padding: 14px 2px 0; display: flex; align-items: baseline; gap: 12px; }
  .name { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .cat { font-size: 12.5px; font-weight: 300; color: var(--dim); }
  footer { max-width: 1520px; margin: 96px auto 0; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 14px; }
  .foot { font-family: "SF Mono", Menlo, monospace; font-size: 11px; letter-spacing: 3px; color: var(--dim); text-transform: uppercase; }
</style>
</head>
<body>

<header>
  <h1>30x web-to-video <span class="soft">— one URL in, a film out.</span></h1>
  <div class="side">
    <code class="cmd" onclick="navigator.clipboard.writeText('npx 30x-web-to-video --global')">npx 30x-web-to-video --global</code>
    <a class="gh" href="https://github.com/norahe0304-art/30x-video" target="_blank">GitHub</a>
    <a class="gh" href="https://www.npmjs.com/package/30x-web-to-video" target="_blank">npm</a>
  </div>
</header>

<div class="grid" id="grid"></div>

<footer>
  <div class="foot">Zero templates · Taste as code</div>
  <div class="foot">MIT · Built with Claude Code</div>
</footer>

<script>
const FILMS = [
  ["05-mana","Maná","Yerba Mate"],
  ["15-dusty","Dusty & Co","Ceramic Studio · take one"],
  ["17-dusty-v2","Dusty & Co","take two — same brand, zero templates, never the same film twice"],
  ["13-idensia","Idensia","Brand Passport"],
  ["14-laper","Laper","Screenwriting Software"],
  ["12-therasun","TheraSun","Spectral Window Film"],
  ["11-orchid","Orchid","iMessage Assistant"],
  ["07-jetpartners","JetPartners","Private Aviation"],
  ["10-corgi","Corgi","Startup Insurance"],
  ["02-caylent","Caylent","AWS Consulting"],
  ["01-happy-model","Happy Model","AI Gateway"],
  ["04-parker","Parker","AI Banking"],
  ["06-cofounder","Cofounder","AI Agent"],
];
const grid = document.getElementById("grid");
FILMS.forEach(([file, brand, cat]) => {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <video preload="none" poster="posters/${file}.jpg" controls playsinline src="films/${file}.mp4"></video>
    <div class="meta"><span class="name">${brand}</span><span class="cat">${cat}</span></div>`;
  grid.appendChild(el);
});
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.preload = "metadata"; io.unobserve(e.target); }
}), { rootMargin: "300px" });
document.querySelectorAll("video").forEach(v => io.observe(v));
document.querySelectorAll("video").forEach(v => v.addEventListener("play", () => {
  document.querySelectorAll("video").forEach(o => { if (o !== v) o.pause(); });
}));
</script>

</body>
</html>
