  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg: #FFFFFF; --ink: #1a1a1a; --mut: #66686a; }
  body { background: var(--bg); color: var(--ink); font-family: Hellix, arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }

  /* ═══ hero — DIOR 实测复刻: 左半 800/1600 全高, 字幕 Atacama 32/-0.02em @86%, 链接 Hellix 500 14 ═══ */
  .hero { position: relative; height: 100vh; background: var(--bg); }
  .hero-media { position: absolute; left: 0; top: 0; width: 50%; height: 100%; overflow: hidden; background: #101010; }
  .hero-media video { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) brightness(0.66) contrast(1.04); }
  .wordmark {
    position: absolute; left: 50%; top: 45.6%; transform: translate(-50%, -50%); z-index: 4;
    font-family: "Atacama VAR", Georgia, serif; font-weight: 480; font-variation-settings: "opsz" 40;
    font-size: 96px; letter-spacing: 0.18em; text-indent: 0.18em;
    color: #fff; white-space: nowrap; opacity: 0; transition: opacity 1.8s ease .3s;
  }
  .wordmark.in { opacity: 1; }
  @media (max-width: 900px) { .wordmark { font-size: 11vw; } }
  .cap { position: absolute; z-index: 5; text-align: center; opacity: 0; transition: opacity 1.6s ease 1s; }
  .cap.in { opacity: 1; }
  .cap .t { font-family: "Atacama VAR", Georgia, serif; font-weight: 400; font-size: 32px; letter-spacing: -0.02em; }
  .cap .s { display: inline-block; margin-top: 15px; font-family: Hellix, arial, sans-serif; font-weight: 500; font-size: 14px;
    text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; cursor: pointer; }
  .cap-l { left: 25%; bottom: 6.5%; transform: translateX(-50%); color: #fff; }
  .cap-r { left: 75%; bottom: 6.5%; transform: translateX(-50%); color: var(--ink); transition-delay: 1.3s; }

  /* ═══ PLP — DIOR 服装列表: 一排 3 个, 细缝, 紧凑 (linear 密度) ═══ */
  .plp-label { text-align: center; padding: 44px 16px 18px; font-family: Hellix, arial, sans-serif;
    font-weight: 500; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink); }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 0 2px; }
  @media (max-width: 900px) { .grid3 { grid-template-columns: 1fr; } }
  .tile { position: relative; background: #101010; overflow: hidden; cursor: pointer; }
  .tile video { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; filter: grayscale(0.9) brightness(0.9); transition: filter .8s ease; }
  .tile:hover video, .tile.playing video { filter: none; }
  .tcap { text-align: center; padding: 14px 8px 30px; background: var(--bg); }
  .tcap .n { font-family: Hellix, arial, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.02em; }
  .tcap .w { margin-top: 5px; font-family: Hellix, arial, sans-serif; font-weight: 400; font-size: 12px; color: var(--mut);
    text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 0.5px; }

  /* atelier push 行 (半宽两块, 字幕压图 — dior push 语法) */
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 0 2px; }
  @media (max-width: 900px) { .row2 { grid-template-columns: 1fr; } }
  .push { position: relative; overflow: hidden; background: #101010; cursor: pointer; }
  .push video { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; filter: grayscale(1) brightness(0.68); transition: filter .9s ease; }
  .push:hover video, .push.playing video { filter: none; }
  .pcap { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); text-align: center; color: #fff; z-index: 3; pointer-events: none; }
  .pcap .t { font-family: "Atacama VAR", Georgia, serif; font-weight: 400; font-size: 32px; letter-spacing: -0.02em; text-shadow: 0 1px 18px rgba(0,0,0,0.35); white-space: nowrap; }
  .pcap .s { display: inline-block; margin-top: 15px; font-family: Hellix, arial, sans-serif; font-weight: 500; font-size: 14px;
    text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .anote { text-align: center; max-width: 620px; margin: 0 auto; padding: 0 20px 26px;
    font-family: "Atacama VAR", Georgia, serif; font-weight: 300; font-size: 19px; line-height: 1.7; color: var(--ink); }

  footer { text-align: center; padding: 90px 20px 80px; }
  .fmark { font-family: "Atacama VAR", Georgia, serif; font-weight: 480; font-size: 54px; letter-spacing: 0.18em; text-indent: 0.18em; }
  .fcmd { margin-top: 22px; }
  .fcmd code { font-family: Hellix, arial, sans-serif; font-weight: 500; font-size: 13px;
    text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 0.5px; cursor: pointer; }
  .flinks { margin-top: 34px; font-family: Hellix, arial, sans-serif; font-size: 11px; letter-spacing: 0.22em; color: var(--mut);
    text-transform: uppercase; display: flex; gap: 36px; justify-content: center; flex-wrap: wrap; }
  .flinks a { text-decoration: none; }
  .reveal { opacity: 0; transition: opacity 1.1s ease; }
  .reveal.in { opacity: 1; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-media"><video autoplay muted loop playsinline src="films/07-jetpartners.mp4" poster="posters/07-jetpartners.jpg"></video></div>
  <div class="wordmark" id="wm">30X</div>
  <div class="cap cap-l" id="c1">
    <div class="t">Web-to-Video Films</div>
    <a class="s" href="#plp">Watch now</a>
  </div>
  <div class="cap cap-r" id="c2">
    <div class="t">One URL in. A film out.</div>
    <code class="s" onclick="navigator.clipboard.writeText('npx 30x-web-to-video --global')">npx 30x-web-to-video --global</code>
  </div>
</div>

<main id="plp"></main>

<footer>
  <div class="fmark">30X</div>
  <div class="fcmd"><code onclick="navigator.clipboard.writeText('npx 30x-web-to-video --global')">npx 30x-web-to-video --global</code></div>
  <div class="flinks">
    <a href="https://github.com/norahe0304-art/30x-video" target="_blank">GitHub</a>
    <a href="https://www.npmjs.com/package/30x-web-to-video" target="_blank">npm</a>
    <span>Built with Claude Code</span>
  </div>
</footer>

<script>
setTimeout(() => document.getElementById("wm").classList.add("in"), 150);
setTimeout(() => document.getElementById("c1").classList.add("in"), 500);
setTimeout(() => document.getElementById("c2").classList.add("in"), 700);

const GROUPS = [
  { label: "Colour & Craft", films: [["05-mana","Maná"],["10-corgi","Corgi"],["06-cofounder","Cofounder"],["04-parker","Parker"],["19-biuty","biuty"],["16-daydream-v2","daydream"]] },
  { label: "Paper & Ink", films: [["14-laper","Laper"],["11-orchid","Orchid"]] },
  { label: "Night & Light", films: [["12-therasun","TheraSun"],["18-solounicorn","Solo Unicorn Club"],["01-happy-model","Happy Model"],["13-idensia","Idensia"]] },
  { label: "Quiet Luxury", films: [["07-jetpartners","JetPartners"],["02-caylent","Caylent"]] },
];

const tile = ([f, b]) => `
  <div class="tile" data-f="${f}">
    <video preload="none" poster="posters/${f}.jpg" playsinline loop muted src="films/${f}.mp4"></video>
  </div>`;
const cap = ([f, b]) => `<div class="tcap"><div class="n">${b}</div><div class="w">Watch the film</div></div>`;

const main = document.getElementById("plp");
GROUPS.forEach(g => {
  // 3 列: 每行 3 tile + 对应字幕行
  let html = `<div class="plp-label reveal">${g.label}</div>`;
  for (let i = 0; i < g.films.length; i += 3) {
    const row = g.films.slice(i, i + 3);
    while (row.length < 3 && g.films.length > 3) break;
    html += `<div class="grid3 reveal">${row.map(tile).join("")}</div>`;
    html += `<div class="grid3" style="gap:2px">${row.map(cap).join("")}</div>`;
  }
  main.insertAdjacentHTML("beforeend", html);
});

main.insertAdjacentHTML("beforeend", `
  <div class="plp-label reveal">The Atelier</div>
  <div class="anote reveal">The same brand, commissioned twice. Each run cuts its own cloth — never the same film twice.</div>
  <div class="row2 reveal">
    <div class="push" data-f="15-dusty">
      <video preload="none" poster="posters/15-dusty.jpg" playsinline loop muted src="films/15-dusty.mp4"></video>
      <div class="pcap"><div class="t">Dusty & Co — Take One</div><div class="s">Watch the film</div></div>
    </div>
    <div class="push" data-f="17-dusty-v2">
      <video preload="none" poster="posters/17-dusty-v2.jpg" playsinline loop muted src="films/17-dusty-v2.mp4"></video>
      <div class="pcap"><div class="t">Dusty & Co — Take Two</div><div class="s">Watch the film</div></div>
    </div>
  </div>`);

const ro = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add("in"); ro.unobserve(e.target); }
}), { rootMargin: "-30px" });
document.querySelectorAll(".reveal").forEach(el => ro.observe(el));

document.querySelectorAll(".tile, .push").forEach(card => {
  const v = card.querySelector("video");
  card.addEventListener("mouseenter", () => { v.muted = true; v.play().catch(()=>{}); });
  card.addEventListener("mouseleave", () => { if (v.muted) { v.pause(); v.currentTime = 0; card.classList.remove("playing"); } });
  card.addEventListener("click", () => {
    document.querySelectorAll(".tile video, .push video").forEach(o => {
      if (o !== v) { o.pause(); o.muted = true; o.controls = false; o.closest(".tile,.push").classList.remove("playing"); }
    });
    v.muted = false; v.controls = true; card.classList.add("playing"); v.play().catch(()=>{});
  });
});

const vio = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.preload = "metadata"; vio.unobserve(e.target); }
}), { rootMargin: "500px" });
document.querySelectorAll(".tile video, .push video").forEach(v => vio.observe(v));
</script>

</body>
</html>
